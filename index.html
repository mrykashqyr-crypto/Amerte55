<!-- Deploy Modal -->
<div id="deployModal" class="fixed inset-0 z-40 hidden bg-slate-950/85 backdrop-blur-md p-3 sm:p-6 overflow-y-auto">
  <div class="max-w-4xl mx-auto panel-card rounded-3xl border-cyan-400/35 overflow-hidden my-4">
    <div class="px-5 py-4 bg-slate-900/95 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h3 class="text-base sm:text-lg font-black text-white">ملفات الرفع الجاهزة لـ GitHub و Render</h3>
        <p class="text-xs text-slate-400">Build Command: <code class="mono text-cyan-300">npm install</code> • Start Command: <code class="mono text-emerald-300">node index.js</code></p>
      </div>
      <button id="closeDeployBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 cursor-pointer">✕ إغلاق</button>
    </div>
    <div class="px-5 pt-3 bg-slate-950/70 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap gap-1.5" id="codeTabs"></div>
      <div class="flex items-center gap-2 pb-2">
        <button id="copyFileBtn" class="px-3 py-1.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-200 border border-cyan-400/40 text-xs font-extrabold cursor-pointer">📋 نسخ</button>
      </div>
    </div>
    <div class="p-4 sm:p-5 bg-[#04070f]">
      <pre id="modalCodePreview" class="custom-scroll mono text-xs text-slate-200 p-4 rounded-2xl bg-slate-950 border border-slate-800 max-h-[380px] overflow-auto leading-relaxed"></pre>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const toastWrap  = $('toastWrap');
  const toastMsg   = $('toastMsg');
  const toastDot   = $('toastDot');
  const toastClose = $('toastClose');
  let toastTimer   = null;

  function showToast(msg, type = 'info') {
    if (!toastWrap || !toastMsg) return;
    toastMsg.textContent = msg;
    if (toastDot) {
      toastDot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + (
        type === 'error' ? 'bg-rose-400' :
        type === 'ok'    ? 'bg-emerald-400' : 'bg-cyan-400'
      );
    }
    toastWrap.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastWrap.classList.add('hidden'), 3500);
  }

  if (toastClose) toastClose.addEventListener('click', () => toastWrap.classList.add('hidden'));

  function getAuthHeaders(extra = {}) {
    const pass = ($('adminPass')?.value || '').trim();
    return Object.assign({}, pass ? { 'x-admin-pass': pass } : {}, extra);
  }

  async function apiRequest(url, options = {}) {
    const opts = Object.assign({}, options);
    opts.headers = getAuthHeaders(opts.headers || {});
    const res = await fetch(url, opts);
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      try { data = await res.json(); } catch {}
    } else {
      const txt = await res.text();
      try { data = JSON.parse(txt); } catch { data = { message: txt }; }
    }
    if (!res.ok) {
      const errMsg = data?.error || data?.message || `HTTP ${res.status}`;
      throw new Error(errMsg);
    }
    return data || {};
  }

  // ── Terminal ───────────────────────────────────────────────
  const termLogs = $('termLogs');
  const termForm = $('termForm');
  const termInput = $('termInput');

  function appendLog(line, color = 'text-slate-300') {
    if (!termLogs) return;
    const div = document.createElement('div');
    div.className = color + ' break-all';
    div.textContent = String(line);
    termLogs.appendChild(div);
    termLogs.scrollTop = termLogs.scrollHeight;
  }

  async function runShell(cmd) {
    const clean = String(cmd || '').trim();
    if (!clean) return;
    appendLog(`$ ${clean}`, 'text-emerald-400 font-semibold');
    try {
      const data = await apiRequest('/api/shell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: clean, cmd: clean }),
      });
      const out = data.output ?? data.stdout ?? data.result ?? data.message ?? '';
      if (out) appendLog(out, 'text-slate-200');
      if (data.stderr) appendLog(data.stderr, 'text-rose-300');
    } catch (e) {
      appendLog(`[ERR] ${e.message}`, 'text-rose-400');
      showToast(e.message, 'error');
    }
  }

  if (termForm) {
    termForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!termInput) return;
      const val = termInput.value;
      termInput.value = '';
      runShell(val);
    });
  }

  document.querySelectorAll('.sh-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const cmd = btn.getAttribute('data-shell');
      if (cmd) runShell(cmd);
    });
  });

  if ($('clearTermBtn')) {
    $('clearTermBtn').addEventListener('click', () => {
      if (termLogs) termLogs.innerHTML = '';
    });
  }

  // ── Bot Controls & Status ──────────────────────────────────
  function renderStatus(data) {
    const running = Boolean(data?.running || data?.online);
    const code    = data?.pairingCode || data?.code || '';

    if ($('globalDot') && $('globalTxt')) {
      $('globalDot').className = 'w-2.5 h-2.5 rounded-full beacon ' + (running ? 'bg-emerald-400' : 'bg-amber-400');
      $('globalTxt').textContent = running ? 'البوت متصل' : 'جاهز / متوقف';
    }
    if ($('botStatusBadge')) {
      $('botStatusBadge').textContent = running ? 'يعمل الآن' : 'متوقف';
      $('botStatusBadge').className = 'px-3 py-1 rounded-xl text-xs font-black border ' + (
        running
          ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/40'
          : 'bg-slate-800 text-slate-400 border-slate-700'
      );
    }
    if ($('pairingBanner') && $('pairingCodeVal')) {
      if (code) {
        $('pairingCodeVal').textContent = String(code).trim();
        $('pairingBanner').classList.remove('hidden');
      } else {
        $('pairingBanner').classList.add('hidden');
      }
    }
    if (Array.isArray(data?.logs) && termLogs && termLogs.children.length === 0) {
      data.logs.forEach((l) => appendLog(l));
    }
  }

  async function refreshStatus() {
    try {
      const data = await apiRequest('/api/status');
      renderStatus(data);
    } catch {}
  }

  async function botAction(action) {
    const file = $('botSelector')?.value || '';
    const phone = ($('botPhone')?.value || '').replace(/\D/g, '');
    try {
      const data = await apiRequest(`/api/bot/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file, botFile: file, phone, botPhone: phone }),
      });
      showToast(data.message || `تم تنفيذ: ${action}`, 'ok');
      refreshStatus();
    } catch (e) {
      showToast(e.message, 'error');
      appendLog(`[ERR] ${action}: ${e.message}`, 'text-rose-400');
    }
  }

  if ($('btnStart'))   $('btnStart').addEventListener('click', () => botAction('start'));
  if ($('btnRestart')) $('btnRestart').addEventListener('click', () => botAction('restart'));
  if ($('btnStop'))    $('btnStop').addEventListener('click', () => botAction('stop'));
  if ($('btnReset'))   $('btnReset').addEventListener('click', () => botAction('reset'));

  if ($('savePhoneBtn')) {
    $('savePhoneBtn').addEventListener('click', async () => {
      const phone = ($('botPhone')?.value || '').replace(/\D/g, '');
      if (!phone) return showToast('أدخل رقم الواتساب أولاً', 'error');
      try {
        const data = await apiRequest('/api/pairing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, botPhone: phone }),
        });
        if (data.code || data.pairingCode) {
          renderStatus({ running: false, pairingCode: data.code || data.pairingCode });
        }
        showToast('تم حفظ الرقم وطلب الكود', 'ok');
      } catch (e) {
        showToast(e.message, 'error');
      }
    });
  }

  // ── File Upload & List ─────────────────────────────────────
  const fileInput  = $('fileInput');
  const dropZone   = $('dropZone');
  const uploadProg = $('uploadProg');
  const progFill   = $('progFill');
  const progLbl    = $('progLbl');
  const filesList  = $('filesList');
  const botSelect  = $('botSelector');

  function renderFiles(files) {
    const list = Array.isArray(files) ? files : [];
    if (botSelect) {
      const prev = botSelect.value;
      botSelect.innerHTML = list.length
        ? list.map((f) => {
            const name = typeof f === 'string' ? f : (f.name || '');
            return `<option value="${name}">${name}</option>`;
          }).join('')
        : '<option value="">— ارفع ملف أولاً —</option>';
      if (prev && [...botSelect.options].some((o) => o.value === prev)) botSelect.value = prev;
    }
    if (!filesList) return;
    if (!list.length) {
      filesList.innerHTML = '<p class="text-xs text-slate-600 italic">لا توجد ملفات بعد</p>';
      return;
    }
    filesList.innerHTML = list.map((f) => {
      const name = typeof f === 'string' ? f : (f.name || '');
      return `<div class="flex items-center justify-between px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs">
        <span class="mono text-cyan-300 truncate">${name}</span>
        <button type="button" data-pick="${name}" class="pick-file text-[11px] font-bold text-emerald-300 hover:underline cursor-pointer">اختيار</button>
      </div>`;
    }).join('');
    filesList.querySelectorAll('.pick-file').forEach((b) => {
      b.addEventListener('click', () => {
        if (botSelect) botSelect.value = b.getAttribute('data-pick') || '';
        showToast(`تم اختيار ${b.getAttribute('data-pick')}`, 'info');
      });
    });
  }

  async function loadFiles() {
    try {
      const data = await apiRequest('/api/files');
      renderFiles(data.files || data);
    } catch {}
  }

  function uploadFiles(fileList) {
    if (!fileList || !fileList.length) return;
    const fd = new FormData();
    for (const file of fileList) fd.append('files', file);

    if (uploadProg) uploadProg.classList.remove('hidden');
    if (progFill) progFill.style.width = '20%';
    if (progLbl) progLbl.textContent = 'جاري الرفع...';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload', true);
    const pass = ($('adminPass')?.value || '').trim();
    if (pass) xhr.setRequestHeader('x-admin-pass', pass);

    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && progFill) {
        const pct = Math.min(95, Math.round((ev.loaded / ev.total) * 100));
        progFill.style.width = pct + '%';
      }
    };

    xhr.onload = () => {
      if (progFill) progFill.style.width = '100%';
      if (xhr.status >= 200 && xhr.status < 300) {
        if (progLbl) progLbl.textContent = 'تم الرفع بنجاح';
        showToast('تم رفع الملفات بنجاح', 'ok');
        loadFiles();
        setTimeout(() => uploadProg && uploadProg.classList.add('hidden'), 1500);
      } else {
        let err = `HTTP ${xhr.status}`;
        try { const j = JSON.parse(xhr.responseText); err = j.error || j.message || err; } catch {}
        if (progLbl) progLbl.textContent = `فشل الرفع: ${err}`;
        showToast(`فشل الرفع: ${err}`, 'error');
      }
    };

    xhr.onerror = () => {
      if (progLbl) progLbl.textContent = 'خطأ في الشبكة أثناء الرفع';
      showToast('خطأ في الشبكة أثناء الرفع', 'error');
    };

    xhr.send(fd);
  }

  if (fileInput) {
    fileInput.addEventListener('change', () => {
      uploadFiles(fileInput.files);
      fileInput.value = '';
    });
  }

  if (dropZone) {
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-cyan-400');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-cyan-400'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-400');
      uploadFiles(e.dataTransfer?.files);
    });
  }

  // ── WhatsApp Sandbox ───────────────────────────────────────
  const sbChat  = $('sbChat');
  const sbForm  = $('sbForm');
  const sbInput = $('sbInput');
  const sbLock  = $('sbLock');
  let locked    = false;

  function addBubble(text, fromMe = true) {
    if (!sbChat) return;
    const wrap = document.createElement('div');
    wrap.className = 'flex ' + (fromMe ? 'justify-end' : 'justify-start');
    const b = document.createElement('div');
    b.className = 'max-w-[82%] px-3.5 py-2 rounded-2xl text-xs sm:text-sm leading-relaxed ' + (
      fromMe
        ? 'bg-emerald-500/20 text-emerald-100 border border-emerald-400/30'
        : 'bg-slate-800/90 text-slate-100 border border-slate-700'
    );
    b.textContent = text;
    wrap.appendChild(b);
    sbChat.appendChild(wrap);
    sbChat.scrollTop = sbChat.scrollHeight;
  }

  function handleSandbox(rawText) {
    const t = String(rawText || '').trim();
    if (!t) return;
    addBubble(t, true);

    const role = $('sbRole')?.value || 'admin';
    if (t.includes('قفل')) {
      if (role !== 'admin') return addBubble('⚠️ هذا الأمر للمشرفين فقط.', false);
      locked = true;
      if (sbLock) {
        sbLock.textContent = '🔒 مقفل';
        sbLock.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-300 border border-rose-400/30';
      }
      return addBubble('🔒 تم قفل المجموعة (محاكاة).', false);
    }
    if (t.includes('فتح')) {
      if (role !== 'admin') return addBubble('⚠️ هذا الأمر للمشرفين فقط.', false);
      locked = false;
      if (sbLock) {
        sbLock.textContent = '🔓 مفتوح';
        sbLock.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-400/30';
      }
      return addBubble('🔓 تم فتح المجموعة (محاكاة).', false);
    }
    if (t.includes('انسى')) {
      if (sbChat) sbChat.innerHTML = '';
      return addBubble('🧠 تم مسح محادثة المحاكاة.', false);
    }
    addBubble(`تم استلام الأمر في المحاكاة: "${t}"`, false);
  }

  if (sbForm) {
    sbForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!sbInput) return;
      const v = sbInput.value;
      sbInput.value = '';
      handleSandbox(v);
    });
  }

  document.querySelectorAll('.wa-q').forEach((btn) => {
    btn.addEventListener('click', () => handleSandbox(btn.getAttribute('data-wa') || ''));
  });

  if ($('resetSbBtn')) {
    $('resetSbBtn').addEventListener('click', () => {
      if (sbChat) sbChat.innerHTML = '';
      locked = false;
      if (sbLock) {
        sbLock.textContent = '🔓 مفتوح';
        sbLock.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-400/30';
      }
    });
  }

  // ── Deploy Modal ───────────────────────────────────────────
  const deployModal    = $('deployModal');
  const codeTabs       = $('codeTabs');
  const modalPreview   = $('modalCodePreview');

  const deploySnippets = {
    'Render Start': `Build Command:\nnpm install\n\nStart Command:\nnode index.js\n\nEnvironment Variables:\nBOT_PHONE=963XXXXXXXXX\nOWNER_PHONE=963XXXXXXXXX\nGEMINI_API_KEY=your_key_here\nADMIN_PASS=amirati2026`,
    'bot.js (تشغيل)': `node bot.js`,
    'bot3.js (عادي)': `node bot3.js`,
  };

  let activeTab = Object.keys(deploySnippets)[0];

  function renderModalTabs() {
    if (!codeTabs || !modalPreview) return;
    codeTabs.innerHTML = Object.keys(deploySnippets).map((name) => {
      const active = name === activeTab;
      return `<button type="button" data-tab="${name}" class="m-tab px-3 py-1.5 rounded-xl text-xs font-extrabold border cursor-pointer ${
        active
          ? 'bg-cyan-500/25 text-cyan-200 border-cyan-400/50'
          : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'
      }">${name}</button>`;
    }).join('');
    modalPreview.textContent = deploySnippets[activeTab] || '';
    codeTabs.querySelectorAll('.m-tab').forEach((b) => {
      b.addEventListener('click', () => {
        activeTab = b.getAttribute('data-tab') || activeTab;
        renderModalTabs();
      });
    });
  }

  if ($('openDeployBtn')) {
    $('openDeployBtn').addEventListener('click', () => {
      renderModalTabs();
      if (deployModal) deployModal.classList.remove('hidden');
    });
  }
  if ($('closeDeployBtn')) {
    $('closeDeployBtn').addEventListener('click', () => deployModal && deployModal.classList.add('hidden'));
  }
  if ($('copyFileBtn')) {
    $('copyFileBtn').addEventListener('click', async () => {
      const txt = modalPreview?.textContent || '';
      try {
        await navigator.clipboard.writeText(txt);
        showToast('تم النسخ إلى الحافظة', 'ok');
      } catch {
        showToast('تعذر النسخ تلقائياً، انسخ النص يدوياً', 'error');
      }
    });
  }

  refreshStatus();
  loadFiles();
  setInterval(refreshStatus, 8000);
})();
</script>
</body>
</html>
